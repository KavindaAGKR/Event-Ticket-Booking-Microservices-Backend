version: 0.2

env:
  variables:
    ECR_REPO: 859793947578.dkr.ecr.ap-southeast-1.amazonaws.com/bookings
    IMAGE_TAG: $CODEBUILD_RESOLVED_SOURCE_VERSION

phases:
  install:
    commands:
      - echo Installing kubectl...
      - curl -o kubectl https://amazon-eks.s3.ap-southeast-1.amazonaws.com/1.30.0/2024-06-12/bin/linux/amd64/kubectl
      - chmod +x ./kubectl
      - mv ./kubectl /usr/local/bin/
      - kubectl version --client

  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws --version
      - $(aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin $ECR_REPO)
      - REPOSITORY_URI=$ECR_REPO
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH}

  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .

  post_build:
    commands:
      - echo Pushing the Docker image...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Updating Kubernetes deployment...
      - aws eks update-kubeconfig --region ap-southeast-1 --name my-cluster
      - kubectl set image deployment/bookings-deployment bookings=$REPOSITORY_URI:$IMAGE_TAG -n default
      - kubectl rollout status deployment/bookings-deployment -n default

artifacts:
  files:
    - bookings-deployment.yaml
