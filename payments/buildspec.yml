version: 0.2

env:
  variables:
    ECR_REPO: 859793947578.dkr.ecr.ap-southeast-1.amazonaws.com/payments
  exported-variables:
    - IMAGE_TAG

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws --version
      - aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin $ECR_REPO
      - export IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - echo "IMAGE_TAG=$IMAGE_TAG"

  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t $ECR_REPO:$IMAGE_TAG -f payments/Dockerfile payments

  post_build:
    commands:
      - echo Pushing the Docker image...
      - docker push $ECR_REPO:$IMAGE_TAG
      - docker tag $ECR_REPO:$IMAGE_TAG $ECR_REPO:latest
      - echo "IMAGE_TAG=$IMAGE_TAG" > imageTag.txt
      - sed -i "s|IMAGE_TAG|${IMAGE_TAG}|g" payments/payments-deployment.yaml

artifacts:
  files:
    - payments/payments-deployment.yaml
    - imageTag.txt
