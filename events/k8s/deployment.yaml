apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-service
  namespace: ticket-booking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: events-service
  template:
    metadata:
      labels:
        app: events-service
    spec:
      containers:
      - name: events-service
        image: kraviprabhath/event-service:latest
        ports:
        - containerPort: 3002
        envFrom:
        - secretRef:
            name: events-service-secrets
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /events/health
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 5
